name: RTL verification

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install open-source RTL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys make g++ python3
      - name: Check generated interfaces
        run: make check-generated
      - name: Lint
        run: make lint
      - name: Icarus smoke test
        run: make smoke
      - name: Verilator C++ regression
        run: make verify RANDOM_OPERATIONS=250 SEED=107
      - name: Yosys synthesis
        run: make synth
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apb-timer-reports
          path: |
            results/
            build/lint/
